# Configurations adapted from Konstantin Schürholt's Scalable Autoencoder for Neural Embeddings
#     https://github.com/HSG-AIML/SANE/blob/main/experiments/resnet18-cifar100/pretrain_sane_cifar100_resnet18.py#L57

#     ## MAY HAVE LATER USE ##
